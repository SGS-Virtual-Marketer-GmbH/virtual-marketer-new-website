<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite nicht gefunden | Virtual Marketer</title>
<meta name="robots" content="noindex, follow">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1a202c; }
  header { max-width: 1140px; margin: 0 auto; padding: 24px 20px; }
  header img { height: 40px; width: auto; }
  main { max-width: 600px; margin: 60px auto; background: #fff; border-radius: 12px; padding: 48px 40px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  h1 { font-size: 72px; margin: 0 0 8px; color: #1a202c; }
  p { font-size: 16px; color: #4a5568; line-height: 1.6; margin: 0 0 28px; }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; }
  a.btn.primary { background: #1a202c; color: #fff; }
  a.btn.secondary { background: transparent; color: #1a202c; border: 1px solid #cbd5e0; }
</style>
<style id="vm-mobile-polish">
/* ==========================================================================
   Mobile polish — see scripts/mobile-polish.js
   ========================================================================== */

/* --- Applies at every width: things that were simply wrong ---------------- */

/* The theme ships "body{overflow:hidden}" (engitech/style.css) alongside
   "html{overflow-x:hidden}". That combination is a scroll hazard, and it is
   the shape of bug that shows up on a phone and not on a desktop.

   Two separate problems in it. Setting overflow:hidden on the body makes the
   body a scroll container that can never scroll, because its height is auto
   and so it always exactly fits its own content. And a hidden value on one
   axis forces a visible value on the other axis to compute to auto, so the
   root ends up as "hidden auto" whether or not anyone asked for that.

   On a desktop the wheel still scrolls the viewport, which is why this
   survived. Touch scrolling is less forgiving, and Safari in particular has
   never handled a body scroll container the way the spec describes.

   The fix is clip rather than visible. The theme genuinely does need the
   horizontal clipping — the off-canvas side panel is a fixed 400px box
   parked past the right edge, and without clipping it would add a horizontal
   scrollbar on every page. But clip clips *without* creating a scroll
   container, so unlike hidden it does not drag the other axis to auto. The
   horizontal overflow stays hidden; vertical scrolling goes back to the
   viewport where it belongs.

   Browsers without overflow:clip (Safari below 16) ignore these declarations
   and keep the theme's current behaviour, so this cannot make anything worse
   than it already is. */
   !important because this block is injected into the head *before* the
   theme's bundled stylesheet, so on equal specificity the theme's own
   "body{overflow:hidden}" wins on document order. Raising specificity
   instead would mean inventing a selector for html and body, which have no
   classes worth matching; this file already answers the theme's !important
   heading clamp the same way. */
html{overflow-x:clip !important;overflow-y:visible !important;}
body{overflow-x:clip !important;overflow-y:visible !important;}

/* A 565px-wide <img> inside a 375px column was forcing horizontal overflow.
   body{overflow-x:hidden} was hiding the symptom; this fixes the cause, so
   the image scales instead of being silently cropped. */
img, video, iframe, canvas, svg { max-width: 100%; }
img, video { height: auto; }

/* In-page anchors landed underneath the fixed header. */
html { scroll-padding-top: 76px; }

@media (max-width: 1024px) {

  /* Long tables and code blocks scroll in their own box rather than widening
     the page. Scoped to mobile deliberately: display:block is what makes a
     table scrollable, and it also switches off table layout — column widths
     stop being distributed. That trade is right on a 375px screen and wrong
     on a desktop one, so this must never escape the media query. */
  table, pre { max-width: 100%; overflow-x: auto; display: block; }

  /* --- 1. The header must be opaque --------------------------------------
     Both the header and the Elementor section inside it are transparent, and
     either one alone leaves the text showing through, so both are set. The
     blur is what gives it the layered, app-like feel rather than a flat bar;
     the -webkit- prefix is still required by Safari, which is most of the
     phone traffic this matters for. */
  #site-header.site-header,
  #site-header .header-mobile > .elementor > .elementor-section,
  #site-header .header-mobile .elementor-top-section {
    background-color: rgba(255, 255, 255, 0.94);
    -webkit-backdrop-filter: saturate(1.7) blur(16px);
    backdrop-filter: saturate(1.7) blur(16px);
  }
  #site-header.site-header {
    border-bottom: 1px solid rgba(36, 20, 23, 0.07);
    /* Notch and Dynamic Island: content sits below the status bar instead of
       under it. Resolves to 0 everywhere else, so it is safe unconditionally. */
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* --- 2. Logo -----------------------------------------------------------
     The image was 30px tall inside a 22px box and clipped. Sizing the image
     and letting the box follow is the fix; display:block removes the inline
     baseline gap that caused the 8px mismatch in the first place.

     aspect-ratio is not decorative here — it closes a real, measured layout
     shift. The source file is a 512x512 square and its width/height HTML
     attributes agree, so a browser that infers aspect-ratio from those
     attributes never needs the image bytes to know the box is square. But
     that inference is undone the moment CSS sets height alone with
     width:auto and no aspect-ratio of its own, which is exactly this rule:
     the box's width is then genuinely unknown until the image decodes.
     Lighthouse's own layout-shift trace named this element directly
     ("Media element lacking an explicit size"), and it was the same
     mechanism behind the site's largest reported shift — the header sits
     sticky above the rest of the page, so a header that briefly renders at
     the wrong width pushes every section below it. Stating the ratio
     explicitly removes the ambiguity instead of relying on inference. */
  #site-header .header-mobile img {
    height: 34px;
    width: auto;
    aspect-ratio: 1 / 1;
    display: block;
  }
  #site-header .header-mobile > .elementor a { display: inline-flex; align-items: center; }

  /* --- 3. Type scale -----------------------------------------------------
     clamp() rather than a fixed size: the headline keeps scaling between the
     narrowest phone and the tablet breakpoint instead of stepping. The upper
     bounds are the theme's own desktop sizes, so nothing grows.

     !important is load-bearing here and is not laziness. Elementor emits a
     per-element selector for every heading it styles — the homepage h1 is
     ".elementor-5668 .elementor-element.elementor-element-292329b2
     .elementor-heading-title", four classes, and it already carries a
     max-width:1024px override of its own setting 50px. There is no generic
     selector that outranks a per-element one for every page without knowing
     each element id, and there are hundreds of them across 173 pages.
     Measured before writing this: without !important the h1 stayed at 50px
     on a 375px viewport. */
  h1, .elementor-widget-heading h1.elementor-heading-title {
    font-size: clamp(28px, 8.2vw, 42px) !important;
    line-height: 1.18 !important;
  }
  h2, .elementor-widget-heading h2.elementor-heading-title {
    font-size: clamp(23px, 6.4vw, 32px) !important;
    line-height: 1.24 !important;
  }
  h3, .elementor-widget-heading h3.elementor-heading-title {
    font-size: clamp(19px, 5vw, 24px) !important;
    line-height: 1.3 !important;
  }
  h1, h2, h3, h4 {
    /* German compounds ("Produktdatenoptimierung") are long enough to overflow
       a 375px column on their own. */
    overflow-wrap: break-word;
    hyphens: auto;
  }
  p, li { font-size: 16px; line-height: 1.65; }

  /* --- 4. Tap targets ----------------------------------------------------
     44px is Apple's minimum and 48dp Google's; 44 satisfies both once the
     surrounding padding is counted.

     Two exclusions, both found by looking at the rendered page rather than
     by reasoning about the markup:
       - Inline links inside prose. Enlarging those breaks paragraph leading.
       - The burger, "#mmenu-toggle button". It is an empty <button> whose
         bars are drawn with pseudo-elements, so forcing display:inline-flex
         on it made the icon disappear entirely. It gets padding instead,
         which enlarges the target without touching how it is drawn. */
  .elementor-button,
  input[type="submit"],
  .vm-header-simple nav a,
  .mmenu-wrapper a {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .mmenu-wrapper a { justify-content: flex-start; }

  /* The burger's hit area is enlarged with a transparent overlay rather than
     with padding. Its three bars are absolutely positioned against
     .mmenu-toggle (left:0, top:50%), so padding moves the origin and the icon
     drifts off-centre — it did, by 12px, on the first attempt. An ::after
     overlay adds 12px of reachable area on every side and moves nothing.
     Note ::after on the TOGGLE, not on the BUTTON: the button's own ::before
     and ::after are two of the three bars. */
  #mmenu-toggle { position: relative; }
  #mmenu-toggle::after { content: ""; position: absolute; inset: -12px; }

  /* --- The burger must be visible against the new white header ----------
     The theme paints the burger white, because it was designed to sit
     transparently over a dark hero image. Section 1 above gives the header an
     opaque light background, which left the icon white on white — invisible
     in the rendered screenshot, though nothing in the markup hints at it.
     Repainting it in the brand's dark ink is the other half of that change.
     The colour is set on all three bars: the button's own background is the
     middle bar, its two pseudo-elements are the outer ones. */
  #mmenu-toggle button,
  #mmenu-toggle button::before,
  #mmenu-toggle button::after {
    background-color: #241417 !important;
  }
  #mmenu-toggle.active button { background-color: transparent !important; }

  /* Primary calls to action span the column — the phone convention, and it
     removes the half-width clipped button on the homepage hero. */
  .elementor-widget-button .elementor-button { width: 100%; }

  /* --- 5. The generated pages' header, compacted -------------------------
     lib/page-chrome.js stacks .vm-header-simple into a column below 900px and
     lets the six nav links wrap. Measured on a feature page at 375x812: the
     bar came to roughly 200px tall — and it is sticky, so a quarter of the
     screen was permanently occupied by navigation.

     Instead: logo row on top, links in a single horizontally scrollable strip
     underneath. That is the phone convention (a scrollable tab bar), it costs
     about 100px, and no link is dropped — which hiding them behind a second
     burger would have done. scrollbar-width:none hides the scrollbar without
     disabling the scroll. */
  .vm-header-simple {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    margin: 8px 10px 0;
    padding: 10px 14px;
  }
  .vm-header-simple > a { justify-content: flex-start; }
  .vm-header-simple > a img { height: 34px !important; }
  .vm-header-simple nav {
    flex-wrap: nowrap;
    justify-content: flex-start;
    gap: 20px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .vm-header-simple nav::-webkit-scrollbar { display: none; }
  .vm-header-simple nav a { flex: 0 0 auto; }

  /* --- App feel ----------------------------------------------------------
     The grey flash on tap is the single strongest "this is a web page" tell.
     touch-action:manipulation removes the 300ms double-tap-zoom delay, so
     buttons respond immediately. */
  a, button, .elementor-button, summary {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  /* Rubber-banding at the end of a scroll container must not drag the page
     behind it. "contain" keeps the browser's pull-to-refresh, which "none"
     would remove — that gesture is expected on Android and taking it away
     makes the site feel less native, not more. */
  body { overscroll-behavior-y: contain; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  /* iOS zooms the viewport when a focused field is under 16px. Nothing on the
     site is today; this keeps that true if a form is added later. */
  input, select, textarea { font-size: 16px; }

  /* Bottom safe area, so the footer and any fixed CTA clear the home
     indicator on a gesture-navigation phone. */
  .vm-footer-simple, footer { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }

  /* --- 6. Two homepage headings sit flush against both screen edges ------
     Measured at 375px: the "Use Cases" heading (element 33444aaf) and the
     "FAQ" heading (element 227feddb) render with 0px on both sides, text
     touching the edge of the phone. Every sibling section heading on the
     same page has 15px, because its column carries Elementor's per-
     breakpoint responsive padding — these two columns simply never had that
     setting configured in the original page build, so no rule exists to
     override; this is an authoring gap in the source Elementor page, not
     something a later pass broke.

     Fixed at the two known element ids rather than a general selector,
     matching how the rest of this file answers other per-element Elementor
     gaps (the codebase has no reusable "content gutter" class to hook into
     instead). 15px matches what the working sibling headings already
     compute to, so this makes the page consistent rather than introducing a
     new value.

     Scoped to the widget wrapper, not the section or column, so it cannot
     touch the marquee ticker in the same section — that one is deliberately
     full-bleed — or the FAQ accordion, which already has its own padding. */
  .elementor-element-33444aaf > .elementor-widget-container,
  .elementor-element-227feddb > .elementor-widget-container {
    padding-left: 15px;
    padding-right: 15px;
  }
}

/* Users who ask for less motion get less motion — required for the animated
   demos, which otherwise autoplay. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
<style id="vm-a11y-links">
:is(p,li,dd,blockquote,figcaption) > a:not(.octf-btn):not(.elementor-button):not(.wp-block-button__link):not(.vm-btn):not([class*="btn"]):not([aria-hidden="true"]){
  text-decoration:underline;
  text-underline-offset:2px;
  text-decoration-thickness:1px;
}
:is(p,li,dd,blockquote,figcaption) > a:not(.octf-btn):not(.elementor-button):not(.wp-block-button__link):not(.vm-btn):not([class*="btn"]):hover{
  text-decoration-thickness:2px;
}
/* The share row and any icon-only link inside a list item: an underline under
   a glyph is noise, and the link is not a text link. */
:is(p,li) > a:has(> svg:only-child),
:is(p,li) > a:has(> i:only-child){text-decoration:none}
</style>
</head>
<body>
<header><a href="/"><img src="/wp-content/uploads/2023/04/cropped-Virtual-Marketer-Logo-128x128-New.webp" alt="Virtual Marketer" width="512" height="512"></a></header>
<main>
  <h1>404</h1>
  <p>Diese Seite konnte leider nicht gefunden werden. Möglicherweise wurde sie verschoben oder existiert nicht mehr.</p>
  <div class="actions">
    <a class="btn primary" href="/">Zur Startseite</a>
    <a class="btn secondary" href="/blog/">Zum Blog</a>
  </div>
</main>

<script>
/**
 * Desktop overlap effects, neutralised on phones.
 *
 * The homepage's red "Industries" section carries margin-top:-195px. On
 * desktop that is an intentional overlap: the section slides up under the
 * hero image. On a 375px screen the hero is far taller, so the same -195px
 * lands on top of the hero's own content and swallows the "Demo" call to
 * action completely — measured: hero spans 0-857, the red section starts at
 * 662. That is the defect visible in the reported screenshot.
 *
 * This is done in script rather than CSS because only NEGATIVE margins are
 * wrong. CSS cannot select "elements whose margin-top is negative", and
 * zeroing every top-level section's margin would flatten spacing the design
 * does want. Reading the computed value is the only way to touch exactly the
 * broken ones.
 *
 * Re-evaluated on resize so rotating a phone to landscape past the
 * breakpoint restores the desktop effect.
 */
(function () {
  var BP = 1024;
  var touched = [];

  function apply() {
    var mobile = window.innerWidth <= BP;

    if (!mobile) {
      touched.forEach(function (t) { t.el.style.marginTop = t.original; });
      touched = [];
      return;
    }
    if (touched.length) return; // already neutralised

    var sections = document.querySelectorAll('.elementor-section.elementor-top-section');
    Array.prototype.forEach.call(sections, function (el) {
      if (parseFloat(window.getComputedStyle(el).marginTop) < 0) {
        touched.push({ el: el, original: el.style.marginTop });
        el.style.marginTop = '0px';
      }
    });
  }

  apply();
  var t;
  window.addEventListener('resize', function () {
    clearTimeout(t);
    t = setTimeout(apply, 150);
  }, { passive: true });
})();
</script>
