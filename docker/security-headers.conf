# Shared security headers.
#
# IMPORTANT: nginx's add_header directive is only inherited from a parent
# block (http/server) into a location block if that location block defines
# NO add_header of its own. Any location that sets even one add_header
# (e.g. a custom Cache-Control) must `include` this file itself, or these
# headers silently disappear for that location. See docker/nginx.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
