# Shared security headers.
#
# IMPORTANT: nginx's add_header directive is only inherited from a parent
# block (http/server) into a location block if that location block defines
# NO add_header of its own. Any location that sets even one add_header
# (e.g. a custom Cache-Control) must `include` this file itself, or these
# headers silently disappear for that location. See docker/nginx.conf.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# frame-src is explicit rather than left to the default-src fallback: with
# no frame-src directive, "default-src 'self'" blocks ALL cross-origin
# iframes, which would silently break the two legitimate ones this site
# embeds (the login page's Cloud Run text-generator app, and the Google
# Form on /modell-anfragen/) with no visible error. Listing them here makes
# the trust boundary explicit and auditable instead of accidental — see the
# broken-embeds audit note in scripts/fix-broken-widgets.js for the sibling
# fix (the third iframe that used to be here, a dangling-CNAME subdomain
# pointing nowhere, was removed rather than allow-listed).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https://docs.google.com https://virtual-marketer-ai-text-generator-2-0-394370849364.us-west1.run.app; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
