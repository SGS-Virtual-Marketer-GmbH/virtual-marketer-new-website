worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;

  # Don't leak nginx version
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml application/xml application/xml+rss
    text/javascript application/javascript application/json
    image/svg+xml font/woff font/woff2;

  # Temp paths writable by non-root user (see Dockerfile)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  # Coarse backstop in front of the booking/contact API — the API itself
  # enforces the real per-endpoint policy (see backend/src/rateLimit.js,
  # e.g. 5 booking submissions / 15 min / IP); this just keeps abusive
  # traffic from ever reaching the Node process at all.
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/m;

  server {
    listen 8080;
    server_name virtual-marketer.de www.virtual-marketer.de _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers ----
    # Included here for the base server context AND re-included inside every
    # location block below that sets its own add_header (Cache-Control) —
    # see docker/security-headers.conf for why.
    include /etc/nginx/security-headers.conf;

    # ---- Legacy WordPress URL redirects (301, permanent) ----
    # /home/ was a duplicate legacy WordPress homepage — canonicalize to /
    location = /home/ { return 301 /; }
    location = /home  { return 301 /; }

    # WordPress admin/API surface no longer exists — do not 404-loop bots into it
    location ^~ /wp-admin/  { return 410; }
    location =  /wp-login.php { return 410; }
    location ^~ /wp-json/   { return 410; }
    location =  /xmlrpc.php { return 410; }

    # Deny dotfiles and backup/source files
    location ~ /\.          { deny all; }
    location ~ \.(bak|sql|log|env)$ { deny all; }

    # ---- Booking + contact API (backend/, a separate container — see
    # docker-compose.yml's "api" service) ----
    # Literal hostname (not a variable+resolver): simplest correct setup for
    # this deployment's scale — nginx resolves "api" once at startup via
    # Docker's embedded DNS. If the api container is ever recreated with a
    # new IP mid-run (rare — it isn't auto-scaled or redeployed
    # independently here), nginx needs a reload/restart to pick that up.
    location ^~ /api/ {
      limit_req zone=api_zone burst=10 nodelay;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      proxy_pass http://api:4000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 15s;
      proxy_connect_timeout 5s;
    }

    # ---- Caching ----
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|webp|svg|avif|ico)$ {
      include /etc/nginx/security-headers.conf;
      expires 1y;
      add_header Cache-Control "public, max-age=31536000, immutable";
      access_log off;
    }

    location = /sitemap.xml {
      include /etc/nginx/security-headers.conf;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }
    location = /robots.txt {
      include /etc/nginx/security-headers.conf;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }

    # ---- Clean URL routing (WordPress-style trailing-slash pages) ----
    location / {
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ $uri/index.html /404.html;
      add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }
  }
}
